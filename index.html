<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>銀河シミュレーター 3D</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js",
      "three/addons/": "./vendor/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <!-- ヘッダー: タイトルとモード切替 -->
  <div id="header">
    <h1>🌌 銀河シミュレーター</h1>
    <div id="mode-tabs">
      <button id="tab-galaxy" class="tab active">銀河系</button>
      <button id="tab-solar" class="tab">太陽系</button>
    </div>
  </div>

  <!-- 惑星編集パネル (太陽系モードのみ) -->
  <button id="panel-toggle" class="hidden">⚙ 惑星設定</button>
  <div id="planet-panel" class="hidden">
    <div class="panel-header">
      <span>惑星の設定</span>
      <button id="panel-close">✕</button>
    </div>

    <label class="field">
      <span>惑星を選択</span>
      <select id="planet-select"></select>
    </label>

    <div id="planet-info"></div>

    <label class="field">
      <span>大きさ: <b id="size-value">×1.0</b></span>
      <input type="range" id="size-slider" min="-1" max="1.1" step="0.01" value="0">
    </label>

    <label class="field">
      <span>重さ: <b id="mass-value">×1.0</b></span>
      <input type="range" id="mass-slider" min="-2" max="3" step="0.01" value="0">
    </label>
    <p class="hint">※ 重くすると太陽との重力が強まり、公転が速くなります</p>

    <button id="swap-btn" class="action">🔄 地球 ⇄ 木星 を入れ替え</button>
    <button id="reset-planets-btn" class="action secondary">↺ 惑星をリセット</button>
  </div>

  <!-- 時間コントロール -->
  <div id="time-bar">
    <div id="time-display">現在</div>
    <input type="range" id="time-slider" min="-3000" max="3000" step="5" value="0">
    <div id="time-buttons">
      <button id="play-btn">▶ 再生</button>
      <select id="speed-select">
        <option value="0.1">×0.1</option>
        <option value="0.5">×0.5</option>
        <option value="1" selected>×1</option>
        <option value="2">×2</option>
        <option value="5">×5</option>
      </select>
      <button id="now-btn">⏺ 現在へ</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
